[platformio]
default_envs = loaf

# ── Xteink X4 — ESP32-C3, 4.26" 800×480 e-ink, 7 buttons via ADC ─────────────
[env:loaf]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 921600

# Community SDK libraries (EInkDisplay, InputManager, SDCardManager)
lib_extra_dirs =
    open-x4-sdk/libs/display
    open-x4-sdk/libs/hardware

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11    ; text/shape rendering on top of EInkDisplay
    bblanchon/ArduinoJson @ ^7               ; JSON for settings / stats persistence
    ; SdFat is pulled in transitively by SDCardManager (community SDK)
    ; BLE comes from the ESP32 Arduino core — no separate lib needed

board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -std=gnu++17
    -Wno-deprecated-declarations
    -DCONFIG_BT_ENABLED=1
    -DCONFIG_BLUEDROID_ENABLED=1

# ── Host-side unit tests (no hardware needed) ─────────────────────────────────
[env:test_native]
platform = native
build_flags =
    -std=c++17
    -DLOAF_NATIVE_TEST=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
lib_deps =
